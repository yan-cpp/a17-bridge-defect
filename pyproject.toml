[project]
name = "a17-bridge-defect"
version = "0.1.0"
description = "A17 bridge surface defect detection and quantification project"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
base = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "Pillow>=10,<12",
  "pydantic>=2.6,<3",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]
ml = [
  "ultralytics>=8.3,<9",
  "scikit-image>=0.23,<1",
  "albumentations>=1.4,<2",
  "timm>=1.0,<2",
  "onnx>=1.16,<2",
  "onnxruntime-gpu>=1.18,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
