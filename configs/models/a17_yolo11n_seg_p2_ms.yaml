# A17 ablation model: YOLO11n-seg + P2/4 + multi-scale PANet.
# Compared with the P2-only variant, this model adds a full top-down and
# bottom-up feature pyramid: P5->P4->P3->P2 and P2->P3->P4->P5.
nc: 3
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]             # 0 P1/2
  - [-1, 1, Conv, [128, 3, 2]]            # 1 P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2 P2/4
  - [-1, 1, Conv, [256, 3, 2]]            # 3 P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4 P3/8
  - [-1, 1, Conv, [512, 3, 2]]            # 5 P4/16
  - [-1, 2, C3k2, [512, True]]            # 6 P4/16
  - [-1, 1, Conv, [1024, 3, 2]]           # 7 P5/32
  - [-1, 2, C3k2, [1024, True]]           # 8 P5/32
  - [-1, 1, SPPF, [1024, 5]]              # 9
  - [-1, 2, C2PSA, [1024]]                # 10

head:
  # Top-down: P5 -> P4 -> P3 -> P2
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]                   # 12
  - [-1, 2, C3k2, [512, False]]                 # 13 P4 top-down

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, Concat, [1]]                   # 15
  - [-1, 2, C3k2, [256, False]]                 # 16 P3 top-down

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 17
  - [[-1, 2], 1, Concat, [1]]                   # 18
  - [-1, 2, C3k2, [128, False]]                 # 19 P2 output

  # Bottom-up: P2 -> P3 -> P4 -> P5
  - [-1, 1, Conv, [128, 3, 2]]                  # 20
  - [[-1, 16], 1, Concat, [1]]                  # 21
  - [-1, 2, C3k2, [256, False]]                 # 22 P3 output

  - [-1, 1, Conv, [256, 3, 2]]                  # 23
  - [[-1, 13], 1, Concat, [1]]                  # 24
  - [-1, 2, C3k2, [512, False]]                 # 25 P4 output

  - [-1, 1, Conv, [512, 3, 2]]                  # 26
  - [[-1, 10], 1, Concat, [1]]                  # 27
  - [-1, 2, C3k2, [1024, True]]                 # 28 P5 output

  # P3 first for the prototype branch; P2/P4/P5 remain multi-scale detection
  # and mask-coefficient levels. Proto thus has stride 4 after its 2x upsample.
  - [[22, 25, 28, 19], 1, Segment, [nc, 32, 256]]  # 29
